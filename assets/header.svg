<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" fill="none" role="img" aria-labelledby="title desc">
<title id="title">kic635 — Building intelligent systems</title>
<desc id="desc">Neon cyan and violet engineering space with animated agent orbits and a glowing core. AI agents, full-stack engineering, observability.</desc>
